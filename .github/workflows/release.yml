name: Release dry run

# Builds, verifies and smoke-tests the distribution artifacts that a release
# would consist of. It NEVER publishes: there is no PyPI upload step, no
# GitHub release step and no tagging step anywhere in this workflow, and it is
# granted no write permission to prove it. Publishing 0.1.0a1 remains a
# deliberate, separate, manual act.

on:
  workflow_dispatch:
  pull_request:
    # Every input this workflow depends on: the version and packaging metadata,
    # the scripts it executes, the lock file that determines the environment it
    # builds and smoke-tests in, and the workflow itself. A test pins this set
    # against the commands actually run below.
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "src/openauc/__init__.py"
      - "CITATION.cff"
      - "scripts/release_check.py"
      - "scripts/verify_artifacts.py"
      - ".github/workflows/release.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    name: Build and verify artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Run the full release check suite
        run: uv run python scripts/release_check.py

      - name: Build distributions
        run: uv build

      - name: Check distribution metadata (twine)
        run: uvx twine check --strict dist/*

      - name: Verify artifact names match the package version
        run: uv run python scripts/verify_artifacts.py

      - name: Install the wheel into a clean environment and smoke-test it
        run: |
          set -euxo pipefail
          python -m venv /tmp/openauc-smoke
          /tmp/openauc-smoke/bin/pip install --upgrade pip
          /tmp/openauc-smoke/bin/pip install dist/*.whl
          /tmp/openauc-smoke/bin/openauc version
          /tmp/openauc-smoke/bin/openauc formats
          /tmp/openauc-smoke/bin/python -c "import openauc; print(openauc.__version__)"

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist-dry-run
          path: dist/
          if-no-files-found: error
